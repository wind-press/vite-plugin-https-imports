name: pkg-pr-new
on:
  push:
    branches-ignore:
      - main
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - uses: actions/setup-node@v2
        with:
          node-version: '22'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Build
        run: npm run prepack

      - name: Publish
        run: npx pkg-pr-new publish
